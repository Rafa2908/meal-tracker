name: CI Development

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db

        ports:
          - "5432:5432"

        options: >-
          --health-cmd="pg_isready -U postgres -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Tests never contact AWS: presigning is local signing and the JWT
    # verifier is mocked. Dummy values work here, on laptops and on forks.
    env:
      NODE_ENV: test
      TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/test_db
      USER_POOL_ID: us-east-1_dummyPool1
      COGNITO_CLIENT_ID: dummy-client-id
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: test-bucket
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run lint-check
        run: npm run lint

      # `npm test` runs the migrations first through the pretest script
      - name: Run tests
        run: npm test
